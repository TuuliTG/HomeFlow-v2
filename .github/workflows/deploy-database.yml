name: Deploy database

# Manual: Actions → Deploy database → Run workflow (on main). Applies new migrations in
# supabase/migrations to the production project and redeploys the Edge Functions.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list the migrations that would be applied
        type: boolean
        default: false
      deploy_functions:
        description: Also deploy the Edge Functions in supabase/functions
        type: boolean
        default: true

concurrency:
  group: deploy-database
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Push migrations to Supabase
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - name: Pending migrations
        run: npx supabase db push --dry-run
      - name: Apply migrations
        if: ${{ !inputs.dry_run }}
        run: npx supabase db push
      - name: Deploy Edge Functions
        if: ${{ !inputs.dry_run && inputs.deploy_functions }}
        run: npx supabase functions deploy

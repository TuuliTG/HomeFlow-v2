name: Deploy database

# Manual: Actions → Deploy database → Run workflow (on main). Applies new migrations in
# supabase/migrations to the production project and redeploys the Edge Functions.
# The `production` environment must allow only `main` as deployment branch: that rule, not the
# check below, keeps other branches away from the secrets.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list the migrations that would be applied
        type: boolean
        default: false
      deploy_functions:
        description: Also deploy the Edge Functions in supabase/functions
        type: boolean
        default: true

concurrency:
  group: deploy-database
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Push migrations to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow on main"
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # No install scripts: they would run next to the Supabase credentials. The CLI binary needs none.
      - run: npm ci --ignore-scripts
      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase db push --dry-run
      - name: Apply migrations
        if: ${{ !inputs.dry_run }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase db push
      - name: Deploy Edge Functions
        if: ${{ !inputs.dry_run && inputs.deploy_functions }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase functions deploy --use-api
